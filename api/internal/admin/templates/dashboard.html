{{template "head" .}}
<div class="page-head">
  <div>
    <p class="eyebrow">Resumen</p>
    <h1>Panel de administración</h1>
    <p class="muted page-sub">Administra el contenido que alimenta la app. La API pública es de solo lectura.</p>
  </div>
  <span class="chip chip-live"><span class="dot" aria-hidden="true"></span> API en vivo</span>
</div>

<section class="cards" aria-label="Colecciones de contenido">
  {{range .Entities}}
  <a class="card" href="/admin/{{.Slug}}">
    <span class="card-icon" aria-hidden="true">{{.Icon}}</span>
    <span class="count">{{index $.Counts .Slug}}</span>
    <span class="label">{{.Label}}</span>
    <span class="card-desc">{{.Desc}}</span>
    <span class="card-go">Gestionar <span aria-hidden="true">→</span></span>
  </a>
  {{end}}
</section>
{{template "footer"}}
