{{template "head" .}}
{{if .Err}}<div class="err">{{.Err}}</div>{{end}}
<div class="row-head">
  <h1>{{if .IsEdit}}Editar{{else}}Nuevo{{end}} · {{.Title}}</h1>
</div>
<form method="post" action="/admin/{{.Entity.Slug}}/{{if .IsEdit}}edit{{else}}new{{end}}" class="stack panel">
  {{if .IsEdit}}
  <input type="hidden" name="{{.Entity.IDField}}" value="{{val .Item .Entity.IDField}}">
  {{end}}
  {{range .Fields}}
  {{$f := .}}
  <label>
    <span>{{$f.Label}}{{if $f.Required}} <abbr title="requerido">*</abbr>{{end}}</span>
    {{if eq $f.Type "textarea"}}
      <textarea name="{{$f.Name}}" rows="3" {{if $f.Required}}required{{end}}>{{val $.Item $f.Name}}</textarea>
    {{else if eq $f.Type "select"}}
      <select name="{{$f.Name}}" {{if $f.Required}}required{{end}}>
        <option value="">— seleccionar —</option>
        {{range (index $.Options $f.Name)}}
        <option value="{{.Value}}" {{if sel $.Item $f.Name .Value}}selected{{end}}>{{.Label}}</option>
        {{end}}
      </select>
    {{else if eq $f.Type "checkbox"}}
      <span class="check"><input type="checkbox" name="{{$f.Name}}" {{if checked $.Item $f.Name}}checked{{end}}> Sí</span>
    {{else if eq $f.Type "int"}}
      <input type="number" step="1" name="{{$f.Name}}" value="{{val $.Item $f.Name}}" {{if $f.Required}}required{{end}}>
    {{else if eq $f.Type "number"}}
      <input type="number" step="any" name="{{$f.Name}}" value="{{val $.Item $f.Name}}" {{if $f.Required}}required{{end}}>
    {{else}}
      <input type="text" name="{{$f.Name}}" value="{{val $.Item $f.Name}}" {{if $f.Required}}required{{end}}>
    {{end}}
    {{if $f.Help}}<small class="muted">{{$f.Help}}</small>{{end}}
  </label>
  {{end}}

  {{if eq .Entity.Slug "delegaciones"}}
  <div class="map-section">
    <label>
      <span>Ubicación en el mapa</span>
      <small class="muted">Haz clic en el mapa para seleccionar la posición. Se actualizarán latitud y longitud automáticamente.</small>
    </label>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <div id="map-picker" style="height: 320px; width: 100%; border-radius: 8px; border: 1px solid var(--line); margin-top: 8px;"></div>
    <script>
      (function() {
        var latInput = document.querySelector('input[name="latitud"]');
        var lngInput = document.querySelector('input[name="longitud"]');
        var defaultLat = latInput && latInput.value ? parseFloat(latInput.value) : 12.1364;
        var defaultLng = lngInput && lngInput.value ? parseFloat(lngInput.value) : -86.2514;
        if (isNaN(defaultLat)) defaultLat = 12.1364;
        if (isNaN(defaultLng)) defaultLng = -86.2514;
        var map = L.map('map-picker').setView([defaultLat, defaultLng], latInput && latInput.value ? 16 : 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        var marker = L.marker([defaultLat, defaultLng], {draggable: true}).addTo(map);
        function updateInputs(latlng) {
          if (latInput) latInput.value = latlng.lat.toFixed(6);
          if (lngInput) lngInput.value = latlng.lng.toFixed(6);
        }
        map.on('click', function(e) {
          marker.setLatLng(e.latlng);
          updateInputs(e.latlng);
        });
        marker.on('dragend', function(e) {
          updateInputs(marker.getLatLng());
        });
        setTimeout(function() { map.invalidateSize(); }, 100);
      })();
    </script>
  </div>
  {{end}}

  <div class="form-actions">
    <button type="submit">Guardar</button>
    <a href="/admin/{{.Entity.Slug}}" class="lnk">Cancelar</a>
  </div>
</form>
{{template "footer"}}
