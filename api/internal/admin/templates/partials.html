{{define "head"}}
<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{.Title}} · Feed Admin</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('feed-admin-theme');
    if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
<div class="shell">
  <div class="mobilebar">
    <button class="icon-btn" type="button" id="nav-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand brand--compact" href="/admin">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
      </span>
      <span class="brand-text"><strong>Feed Admin</strong><small>NicTra</small></span>
    </a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Cambiar tema">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>

  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/admin">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
      </span>
      <span class="brand-text"><strong>Feed Admin</strong><small>NicTra · Contenido</small></span>
    </a>

    <nav class="nav" aria-label="Navegación principal">
      <p class="nav-title">General</p>
      <a class="nav-link {{if eq $.Active "inicio"}}is-active{{end}}" href="/admin">
        <span class="nav-icon" aria-hidden="true">🏠</span>Inicio
      </a>
      <p class="nav-title">Contenido</p>
      {{range .Entities}}
      <a class="nav-link {{if eq $.Active .Slug}}is-active{{end}}" href="/admin/{{.Slug}}">
        <span class="nav-icon" aria-hidden="true">{{.Icon}}</span>{{.Label}}
      </a>
      {{end}}
    </nav>

    <div class="sidebar-foot">
      <button class="theme-toggle" type="button" data-theme-toggle>
        <span class="theme-toggle-icons" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></svg>
        </span>
        <span class="theme-label">Cambiar tema</span>
      </button>
      <form method="post" action="/admin/logout" class="logout">
        <button type="submit" class="btn btn-ghost btn-block">Cerrar sesión</button>
      </form>
    </div>
  </aside>

  <main class="content">
{{end}}

{{define "barehead"}}
<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Acceso · Feed Admin</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('feed-admin-theme');
    if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body class="auth-body">
<main class="auth-main">
{{end}}

{{define "footer"}}
  </main>
</div>
<script src="/admin/static/admin.js" defer></script>
</body>
</html>
{{end}}
